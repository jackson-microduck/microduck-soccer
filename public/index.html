<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff6a1a">
  <title>Microduck League</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/build/three.module.js",
      "three/addons/": "/vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="match" class="hidden" aria-hidden="true">
    <div id="stage"></div>
    <div class="scorebug" id="scorebug">
      <div class="side home">
        <img id="home-logo" alt="" width="36" height="36">
        <span id="home-name"></span>
      </div>
      <div class="mid">
        <div class="nums"><b id="home-score">0</b><span>–</span><b id="away-score">0</b></div>
        <div id="clock">3:00</div>
        <div class="stamina" title="Stamina"><span id="stamina-fill"></span></div>
        <div id="club-line"></div>
      </div>
      <div class="side away">
        <span id="away-name"></span>
        <img id="away-logo" alt="" width="36" height="36">
      </div>
    </div>
    <button id="help-btn" class="icon-btn" type="button" aria-label="Controls">?</button>
    <button id="leave-btn" class="icon-btn leave" type="button">Leave</button>
    <div id="banner" class="hidden"></div>
    <p id="credit">Microduck by Pollen Robotics · CC BY-NC-SA 4.0 · non-commercial fan game</p>
    <div id="touch">
      <div id="stick" aria-label="Move joystick"><div id="knob"></div></div>
      <div id="pad"></div>
    </div>
    <div id="key-hint">Shift sprint · Q spin · C slide · K kick · J pass</div>
    <div id="help" class="hidden"></div>
  </div>
  <script type="module" src="/client/main.js"></script>
</body>
</html>
